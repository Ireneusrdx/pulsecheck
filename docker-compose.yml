services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulsecheck
      POSTGRES_PASSWORD: pulsecheck
      POSTGRES_DB: pulsecheck
    ports:
      - "5432:5432"
    volumes:
      - pulsecheck-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsecheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://pulsecheck:pulsecheck@db:5432/pulsecheck
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pulsecheck-db:
